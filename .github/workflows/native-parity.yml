name: Native PHP parity

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4.23
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.23'
          coverage: none
          tools: none
      - name: Verify PHP contract version
        run: |
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { fwrite(STDERR, "Expected PHP 8.4, got " . PHP_VERSION . PHP_EOL); exit(1); } echo PHP_VERSION, PHP_EOL;'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential zlib1g-dev libssl-dev libmagic-dev \
            libcrypt-dev libcurl4-openssl-dev libexif-dev
      - name: Build native Jinx
        run: ./scripts/build-native-jinx.sh
      - name: Run native method parity probes
        run: php scripts/test-native-method-oracle-asm.php
      - name: Smoke implemented-function benchmark
        run: |
          test "$(./jinx native-benchmark-id)" = "native-root-jinx"
          JINX_SKIP_BUILD=1 php scripts/benchmark-native-implemented-functions.php 3 --limit=3
          JINX_SKIP_BUILD=1 php scripts/benchmark-native-implemented-functions.php 3 --limit=1 '--name=Exception::getMessage'
      - name: Run paired PHP vs native benchmark
        run: |
          php scripts/benchmark-php-vs-native-paired.php 200000 --mode=parallel --only=abs,acos,acosh,asin,atan,atan2,ceil,cos,cosh,exp,expm1,fdiv,fmod,hypot,intdiv,log,log1p,pi,pow,round,sin,sinh,sqrt,tan,tanh
          php scripts/benchmark-php-vs-native-paired.php 200000 --mode=serial --only=abs,acos,acosh,asin,atan,atan2,ceil,cos,cosh,exp,expm1,fdiv,fmod,hypot,intdiv,log,log1p,pi,pow,round,sin,sinh,sqrt,tan,tanh
      - name: Run registered Jinx parity suite
        run: php scripts/test-native-jinx.php
